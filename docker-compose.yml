services:
  postgres:
    image: postgres:16-alpine
    container_name: athensears-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strapi']
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile.dev
    container_name: athensears-cms
    restart: unless-stopped
    # Secrets (APP_KEYS, salts, JWT/encryption) live in the app's own env file,
    # same pattern as the crawler. Copy apps/cms/.env.example -> apps/cms/.env.
    env_file:
      - apps/cms/.env
    environment:
      # Docker-topology config only — differs from local/prod, so it stays here,
      # not in apps/cms/.env (e.g. DATABASE_HOST is the compose service name).
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: development
    ports:
      - '1337:1337'
    volumes:
      - ./apps/cms:/app/apps/cms
      - /app/apps/cms/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  gig-crawler:
    build:
      context: .
      dockerfile: apps/gig-crawler/Dockerfile.dev
    container_name: athensears-gig-crawler
    restart: unless-stopped
    env_file:
      - apps/gig-crawler/.env
    environment:
      STRAPI_API_URL: http://cms:1337
      PORT: 3000
      NODE_ENV: development
      TZ: Europe/Athens
      LOG_LEVEL: debug
    ports:
      - '3000:3000'
    volumes:
      - ./apps/gig-crawler:/app/apps/gig-crawler
      - /app/apps/gig-crawler/node_modules
    depends_on:
      - cms

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: athensears-web
    restart: unless-stopped
    environment:
      # Server-side fetch over the compose network
      STRAPI_INTERNAL_URL: http://cms:1337
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
    ports:
      - '4321:4321'
    depends_on:
      - cms

volumes:
  postgres_data:
